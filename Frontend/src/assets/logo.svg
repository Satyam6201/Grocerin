<svg viewBox="0 0 600 300" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0f9f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e8f5f1;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="cartGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2ecc71;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#27ae60;stop-opacity:1" />
    </linearGradient>
    
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="2" dy="2" stdDeviation="4" flood-opacity="0.2"/>
    </filter>
  </defs>
  
  <rect width="600" height="300" fill="url(#bgGradient)"/>
  
  <!-- Left side: Shopping Cart Icon with Leaves -->
  <g transform="translate(80, 80)" filter="url(#shadow)">
    <!-- Cart wheels -->
    <circle cx="30" cy="120" r="8" fill="#27ae60"/>
    <circle cx="90" cy="120" r="8" fill="#27ae60"/>
    
    <!-- Cart body -->
    <path d="M 20 100 Q 15 80, 25 60 L 105 60 Q 115 80, 110 100 Z" fill="url(#cartGradient)" stroke="#1e8449" stroke-width="2"/>
    
    <!-- Cart handle -->
    <path d="M 35 60 Q 60 30, 95 60" fill="none" stroke="#27ae60" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Leaf 1 (Left side) -->
    <g transform="translate(-15, 20) rotate(-30)">
      <ellipse cx="0" cy="0" rx="18" ry="28" fill="#2ecc71" stroke="#229954" stroke-width="1.5"/>
      <path d="M -8 -15 Q 0 0, -8 15" fill="none" stroke="#229954" stroke-width="1" opacity="0.6"/>
    </g>
    
    <!-- Leaf 2 (Right side) -->
    <g transform="translate(130, 15) rotate(25)">
      <ellipse cx="0" cy="0" rx="18" ry="28" fill="#16a085" stroke="#117a65" stroke-width="1.5"/>
      <path d="M -8 -15 Q 0 0, -8 15" fill="none" stroke="#117a65" stroke-width="1" opacity="0.6"/>
    </g>
    
    <!-- Leaf 3 (Top center) -->
    <g transform="translate(60, -10) rotate(0)">
      <ellipse cx="0" cy="0" rx="16" ry="26" fill="#1abc9c" stroke="#16a085" stroke-width="1.5"/>
      <path d="M -7 -13 Q 0 0, -7 13" fill="none" stroke="#16a085" stroke-width="1" opacity="0.6"/>
    </g>
    
    <!-- Vegetables/items in cart (circles) -->
    <circle cx="45" cy="75" r="6" fill="#e74c3c" opacity="0.8"/>
    <circle cx="65" cy="70" r="6" fill="#f39c12" opacity="0.8"/>
    <circle cx="85" cy="75" r="6" fill="#e67e22" opacity="0.8"/>
  </g>
  
  <!-- Right side: Text -->
  <g transform="translate(280, 85)">
    <!-- Main text: grocerin -->
    <text x="0" y="50" font-family="Arial, sans-serif" font-size="72" font-weight="bold" fill="#27ae60" letter-spacing="2">
      grocerin
    </text>
    
    <!-- Tagline -->
    <text x="0" y="80" font-family="Arial, sans-serif" font-size="18" fill="#16a085" letter-spacing="1" font-weight="300">
      Fresh Groceries, Online
    </text>
    
    <!-- Decorative line -->
    <line x1="0" y1="95" x2="240" y2="95" stroke="#2ecc71" stroke-width="3" stroke-linecap="round"/>
  </g>
  
  <!-- Decorative elements -->
  <circle cx="520" cy="50" r="30" fill="#2ecc71" opacity="0.1"/>
  <circle cx="50" cy="250" r="25" fill="#1abc9c" opacity="0.08"/>
</svg>