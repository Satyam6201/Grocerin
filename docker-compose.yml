version: '3.8'

services:
  # MongoDB Database
  mongo:
    image: mongo:7.0
    container_name: grocerin_mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - grocerin_net
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis In-Memory Cache & Rate-Limiter Store
  redis:
    image: redis:7.2-alpine
    container_name: grocerin_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - grocerin_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Express REST API Backend
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: grocerin_backend
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongo:27017/grocerin
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET:-grocerin_super_secret_jwt_key_2025}
      - SELLER_EMAIL=${SELLER_EMAIL:-admin@grocerin.com}
      - SELLER_PASSWORD=${SELLER_PASSWORD:-admin12345}
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME:-}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY:-}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET:-}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:-}
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - grocerin_net

  # React + Vite + Nginx Frontend
  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
      args:
        - VITE_BACKEND_URL=
        - VITE_CURRENCY=₹
    container_name: grocerin_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - grocerin_net

volumes:
  mongo_data:
  redis_data:

networks:
  grocerin_net:
    driver: bridge